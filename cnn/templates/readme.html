{% extends "base.html" %}

{% block head %}
<style>
    /* GitHub style markdown rendering basics */
    .markdown-body {
        text-align: left;
        line-height: 1.6;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
    }
    .markdown-body h1 {
        padding-bottom: 0.3em;
        font-size: 2em;
        border-bottom: 1px solid var(--border-color);
    }
    .markdown-body h2 {
        padding-bottom: 0.3em;
        font-size: 1.5em;
        border-bottom: 1px solid var(--border-color);
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol {
        margin-top: 0;
        margin-bottom: 16px;
    }
    .markdown-body pre {
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        background-color: #f6f8fa;
        border-radius: var(--radius-sm);
    }
    .markdown-body code {
        padding: 0.2em 0.4em;
        margin: 0;
        font-size: 85%;
        background-color: rgba(27,31,35,0.05);
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
    }
    .markdown-body pre code {
        background-color: transparent;
        padding: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="premium-card">
    <div class="markdown-body">
        {{ readme_html|safe }}
    </div>
</div>
{% endblock %}
