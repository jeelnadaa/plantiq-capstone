<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee RAG System</title>
    <!-- Satoshi Font from Fontshare -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/" class="logo">Coffee RAG</a>
            <div class="provider-toggle">
                <input type="radio" id="provider-gemini" name="llm-provider" value="gemini" checked>
                <label for="provider-gemini">Gemini</label>
                <input type="radio" id="provider-groq" name="llm-provider" value="groq">
                <label for="provider-groq">Groq</label>
                <div class="toggle-slider"></div>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/query">Query</a></li>
                <li><a href="/demo">Demo</a></li>
                <li><a href="/readme">Readme</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Coffee RAG System.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
