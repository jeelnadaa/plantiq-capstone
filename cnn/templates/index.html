{% extends "base.html" %}

{% block content %}
<header class="page-header">
    <h1>Analyze Leaves</h1>
    <p class="subtitle">Upload coffee leaves below to run inferences</p>
</header>

<!-- Single / Multi Image Upload Section -->
<section class="upload-section">
    <div class="drop-zone" id="drop-zone">
        <span class="drop-icon">⚲</span>
        <p>Drag and drop images here or <strong>browse</strong></p>
        <input type="file" id="file-input" multiple accept="image/*" hidden>
    </div>
</section>

<!-- Loading Spinner for Predictions -->
<div class="loading-state" id="predict-loading" style="display: none;">
    <div class="spinner"></div>
    <p>Analyzing images...</p>
</div>

<!-- Overall Metrics Section (Shown for multi-image uploads) -->
<section id="overall-metrics-section" class="results-section hidden">
    <div class="premium-card overall-card">
        <h2>Batch Summary</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">Total Analyzed</span>
                <span class="stat-value" id="overall-total">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Dom. Disease</span>
                <span class="stat-value" id="overall-dominant">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Healthy Ratio</span>
                <span class="stat-value" id="overall-healthy">-</span>
            </div>
        </div>
    </div>
</section>

<!-- Individual Image Results Container -->
<section id="individual-results-grid" class="results-grid hidden">
    <!-- Cards injected via JS -->
</section>
{% endblock %}
