[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
markers =
    unit: pure functions and services in isolation
    integration: API + database with fake ML
    functional: end-to-end user journeys through the API
    security: attack and abuse cases
    nonfunctional: performance, load, limits, i18n, a11y-related checks
    ml: loads the real CNN weights / RAG models (slow)
filterwarnings =
    ignore::DeprecationWarning
